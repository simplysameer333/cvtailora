name: Graph Engine — Regression Gate

# Runs the graph+loop engine's unit + end-to-end tests (async DAG runner, shared
# category checkers, section generators, both graph flows via a fake gateway, the
# loop controller, tier rules, validators). No API key needed — the fake gateway
# means the gate always runs and is deterministic. Triggers on graph/pipeline or
# test changes; not on frontend or docs.

on:
  push:
    branches: [main]
    paths:
      - 'backend/services/graph/**'
      - 'backend/services/llm/**'
      - 'backend/services/pipeline/**'
      - 'backend/services/generation_service.py'
      - 'backend/services/cv_check_flow.py'
      - 'backend/tests/**'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run the test suite (graph engine + pipeline)
        working-directory: backend
        env:
          # A dummy key satisfies config (no real calls — tests inject a fake gateway).
          ANTHROPIC_API_KEY: ci-dummy-key
          MONGODB_URI: mongodb://localhost/ci
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/ -q
